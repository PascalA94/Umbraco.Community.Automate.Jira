version: 2
# No routine version PRs (portfolio CI rule 9). Security updates stay on through the repo setting, and dev-tool
# majors are upgraded by hand in their own PR.
updates:
  # The Automate and CMS floors are portfolio decisions held in Directory.Build.props properties,
  # so Dependabot cannot and should not bump them; those bumps are manual (runbook).
  # A bump that does land needs both lines' lock files regenerated before the floor leg passes.
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/src/*"
      - "/tests/*"
      - "/demo/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
