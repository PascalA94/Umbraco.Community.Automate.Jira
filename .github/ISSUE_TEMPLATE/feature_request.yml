name: Feature request
description: Suggest an action, field or behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: versions
    attributes:
      label: Umbraco and Automate versions you use
