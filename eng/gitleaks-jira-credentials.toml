# Sample gitleaks rules for the Umbraco Automate connector for Jira. A sample, not a guarantee: they catch the
# usual ways a Jira API token or webhook secret ends up committed, nothing more.
# Copy the [[rules]] blocks into your site's .gitleaks.toml (keep [extend] useDefault so the built-in rules stay on).

[extend]
useDefault = true

# Nested JSON: "Credentials": { "<name>": { "ApiToken": "…" } } in a committed settings file.
# Matches only inside a Credentials object, so Umbraco's own "Email" settings do not trip it.
[[rules]]
id = "umbraco-automate-jira-credential-json"
description = "A Jira API token or webhook secret in an Umbraco:Automate:Jira:Credentials block of a committed JSON file"
path = '''(?i)\.json$'''
regex = '''(?is)"Credentials"\s*:\s*\{\s*"[a-z0-9]{1,32}"\s*:\s*\{[^{}]*?"(?:ApiToken|WebhookSecret)"\s*:\s*"([^"]{8,})"'''
secretGroup = 1
keywords = ["apitoken", "webhooksecret"]

# Flat keys anywhere: "Umbraco:Automate:Jira:Credentials:<name>:ApiToken": "…" in JSON,
# Umbraco__Automate__Jira__Credentials__<name>__ApiToken=… in .env files, launchSettings.json or scripts.
[[rules]]
id = "umbraco-automate-jira-credential-key"
description = "A Jira API token or webhook secret set by its full Umbraco:Automate:Jira:Credentials key"
regex = '''(?i)Umbraco(?:__|:)Automate(?:__|:)Jira(?:__|:)Credentials(?:__|:)[a-z0-9]{1,32}(?:__|:)(?:ApiToken|WebhookSecret)["']?\s*[:=]\s*["']?([^"'\s]{8,})'''
secretGroup = 1
keywords = ["credentials"]
